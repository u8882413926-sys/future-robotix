<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quad-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="quad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad9)"/>
  <ellipse cx="400" cy="515" rx="260" ry="32" fill="url(#plat-glow9)"/>

  <g filter="url(#shadow9)">
    <!-- Back Left Leg (background) -->
    <path d="M 260 300 L 220 380 L 210 490" stroke="url(#quad-dark)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="210" cy="495" r="14" fill="#020617"/>

    <!-- Front Left Leg (background) -->
    <path d="M 500 300 L 470 380 L 460 490" stroke="url(#quad-dark)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="460" cy="495" r="14" fill="#020617"/>

    <!-- Main Torso Chassis -->
    <rect x="240" y="240" width="310" height="95" rx="28" fill="url(#quad-white)"/>
    <rect x="270" y="260" width="180" height="55" rx="14" fill="url(#quad-dark)"/>
    <!-- Battery / Status LED strip -->
    <line x1="290" y1="288" x2="420" y2="288" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

    <!-- Back Right Leg (foreground) -->
    <circle cx="270" cy="285" r="28" fill="url(#quad-dark)"/>
    <path d="M 270 285 L 230 380 L 250 490" stroke="url(#quad-white)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="230" cy="380" r="16" fill="url(#quad-dark)"/>
    <circle cx="250" cy="495" r="16" fill="#020617"/>

    <!-- Front Right Leg (foreground) -->
    <circle cx="510" cy="285" r="28" fill="url(#quad-dark)"/>
    <path d="M 510 285 L 535 385 L 515 490" stroke="url(#quad-white)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="535" cy="385" r="16" fill="url(#quad-dark)"/>
    <circle cx="515" cy="495" r="16" fill="#020617"/>

    <!-- Neck & Head Assembly -->
    <path d="M 520 250 L 590 190 L 610 230 L 540 290 Z" fill="url(#quad-dark)"/>
    <!-- Sculpted Dog Head Module -->
    <path d="M 560 170 C 560 145, 650 145, 660 175 L 675 220 C 675 235, 570 235, 570 220 Z" fill="url(#quad-white)"/>
    <!-- Visor with Optical Stereo Cameras -->
    <rect x="600" y="172" width="65" height="26" rx="8" fill="#020617"/>
    <circle cx="618" cy="185" r="6" fill="#38BDF8"/>
    <circle cx="645" cy="185" r="6" fill="#38BDF8"/>
    
    <!-- Tail Indicator -->
    <path d="M 245 250 Q 210 220 220 180" stroke="url(#quad-dark)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="220" cy="180" r="7" fill="#38BDF8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · PET ESSENTIAL</text>
</svg>
