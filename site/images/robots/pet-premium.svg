<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow11" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor-matte" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="robotic-arm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad11)"/>
  <ellipse cx="400" cy="515" rx="275" ry="34" fill="url(#plat-glow11)"/>

  <g filter="url(#shadow11)">
    <!-- Back Left Leg (background) -->
    <path d="M 255 290 L 195 380 L 190 490" stroke="#0F172A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="190" cy="495" r="15" fill="#020617"/>

    <!-- Front Left Leg (background) -->
    <path d="M 505 290 L 465 380 L 455 490" stroke="#0F172A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="455" cy="495" r="15" fill="#020617"/>

    <!-- Main Rugged Armor Chassis -->
    <rect x="230" y="230" width="330" height="105" rx="24" fill="url(#armor-matte)"/>
    
    <!-- Top-Mounted 5-DOF Articulated Robotic Inspection Arm -->
    <circle cx="330" cy="230" r="18" fill="url(#robotic-arm-grad)"/>
    <path d="M 330 230 L 320 150 L 400 120" stroke="url(#robotic-arm-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="320" cy="150" r="14" fill="#38BDF8"/>
    <circle cx="400" cy="120" r="12" fill="url(#robotic-arm-grad)"/>
    <!-- Gripper / Inspection Camera Head -->
    <rect x="390" y="105" width="45" height="30" rx="8" fill="#0F172A"/>
    <circle cx="420" cy="120" r="6" fill="#38BDF8"/>
    <line x1="435" y1="110" x2="455" y2="105" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="435" y1="130" x2="455" y2="135" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

    <!-- Back Right Leg (foreground) -->
    <circle cx="260" cy="285" r="32" fill="#0F172A"/>
    <path d="M 260 285 L 215 385 L 240 490" stroke="url(#armor-matte)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="215" cy="385" r="16" fill="#0F172A"/>
    <circle cx="240" cy="495" r="16" fill="#020617"/>

    <!-- Front Right Leg (foreground) -->
    <circle cx="525" cy="285" r="32" fill="#0F172A"/>
    <path d="M 525 285 L 560 385 L 535 490" stroke="url(#armor-matte)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="560" cy="385" r="16" fill="#0F172A"/>
    <circle cx="535" cy="495" r="16" fill="#020617"/>

    <!-- Neck & Sensor Head Module -->
    <path d="M 535 240 L 605 180 L 630 220 L 560 280 Z" fill="#0F172A"/>
    <path d="M 575 160 C 575 135, 670 135, 680 165 L 695 210 C 695 225, 590 225, 590 210 Z" fill="url(#armor-matte)"/>
    <rect x="620" y="162" width="70" height="30" rx="8" fill="#020617"/>
    <circle cx="642" cy="177" r="7" fill="#38BDF8"/>
    <circle cx="672" cy="177" r="7" fill="#38BDF8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · PET PREMIUM</text>
</svg>
