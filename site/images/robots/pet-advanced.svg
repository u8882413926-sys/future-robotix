<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carbon-grey" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad10)"/>
  <ellipse cx="400" cy="515" rx="270" ry="32" fill="url(#plat-glow10)"/>

  <g filter="url(#shadow10)">
    <!-- Back Left Leg (background) -->
    <path d="M 260 295 L 210 380 L 205 490" stroke="#0F172A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="205" cy="495" r="14" fill="#020617"/>

    <!-- Front Left Leg (background) -->
    <path d="M 500 295 L 460 380 L 455 490" stroke="#0F172A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="455" cy="495" r="14" fill="#020617"/>

    <!-- Main Torso Chassis (Reinforced Research Spec) -->
    <rect x="235" y="235" width="320" height="100" rx="24" fill="url(#carbon-grey)"/>
    
    <!-- Top-Mounted Research Sensor Payload Rack -->
    <rect x="280" y="195" width="220" height="42" rx="10" fill="#0F172A"/>
    <!-- LiDAR Sensor Dome -->
    <rect x="360" y="165" width="60" height="32" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <line x1="365" y1="181" x2="415" y2="181" stroke="#38BDF8" stroke-width="3"/>
    <!-- Dual RealSense Depth Cameras -->
    <rect x="440" y="180" width="45" height="18" rx="5" fill="#38BDF8"/>
    <circle cx="450" cy="189" r="4" fill="#0F172A"/>
    <circle cx="470" cy="189" r="4" fill="#0F172A"/>

    <!-- Back Right Leg (foreground) -->
    <circle cx="265" cy="285" r="30" fill="#0F172A"/>
    <circle cx="265" cy="285" r="12" fill="url(#accent-cyan)"/>
    <path d="M 265 285 L 225 385 L 250 490" stroke="url(#carbon-grey)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="225" cy="385" r="16" fill="#0F172A"/>
    <circle cx="250" cy="495" r="16" fill="#020617"/>

    <!-- Front Right Leg (foreground) -->
    <circle cx="515" cy="285" r="30" fill="#0F172A"/>
    <circle cx="515" cy="285" r="12" fill="url(#accent-cyan)"/>
    <path d="M 515 285 L 545 385 L 525 490" stroke="url(#carbon-grey)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="545" cy="385" r="16" fill="#0F172A"/>
    <circle cx="525" cy="495" r="16" fill="#020617"/>

    <!-- Neck & Sensor Head Module -->
    <path d="M 525 245 L 595 185 L 620 225 L 550 285 Z" fill="#0F172A"/>
    <path d="M 565 165 C 565 140, 660 140, 670 170 L 685 215 C 685 230, 580 230, 580 215 Z" fill="url(#carbon-grey)"/>
    <rect x="610" y="168" width="68" height="28" rx="8" fill="#020617"/>
    <circle cx="630" cy="182" r="7" fill="#38BDF8"/>
    <circle cx="660" cy="182" r="7" fill="#38BDF8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · PET ADVANCED (ROS 2)</text>
</svg>
