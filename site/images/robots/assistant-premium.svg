<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body-prem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="metal-titan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad6)"/>
  <ellipse cx="400" cy="525" rx="230" ry="34" fill="url(#plat-glow6)"/>

  <g filter="url(#shadow6)">
    <!-- Omnidirectional Aero Drive Platform -->
    <path d="M 285 450 C 285 435, 515 435, 515 450 L 505 500 C 505 515, 295 515, 295 500 Z" fill="url(#metal-titan)"/>
    <ellipse cx="400" cy="460" rx="100" ry="8" fill="#38BDF8" opacity="0.8"/>
    
    <!-- Torso Column / Elegant Sculpted Pylon -->
    <path d="M 330 260 L 470 260 L 485 448 L 315 448 Z" fill="url(#body-prem)"/>
    
    <!-- Dual Secure Storage Compartment Doors -->
    <rect x="340" y="325" width="55" height="90" rx="8" fill="url(#metal-titan)"/>
    <rect x="405" y="325" width="55" height="90" rx="8" fill="url(#metal-titan)"/>
    <circle cx="385" cy="370" r="3" fill="#38BDF8"/>
    <circle cx="415" cy="370" r="3" fill="#38BDF8"/>

    <!-- Dual Integrated Tablet Console -->
    <rect x="300" y="190" width="200" height="110" rx="16" fill="url(#metal-titan)"/>
    <rect x="308" y="198" width="184" height="94" rx="12" fill="#020617"/>
    <!-- Executive Concierge Dashboard -->
    <rect x="325" y="215" width="70" height="60" rx="6" fill="#1E293B"/>
    <rect x="405" y="215" width="70" height="60" rx="6" fill="#1E293B"/>
    <circle cx="360" cy="240" r="12" fill="#38BDF8"/>
    <rect x="335" y="258" width="50" height="4" rx="2" fill="#94A3B8"/>
    <circle cx="440" cy="240" r="12" fill="#10B981"/>
    <rect x="415" y="258" width="50" height="4" rx="2" fill="#94A3B8"/>

    <!-- Articulated Multi-Axis Neck -->
    <rect x="380" y="150" width="40" height="42" rx="8" fill="url(#metal-titan)"/>

    <!-- Aerodynamic Head Unit with Telepresence Cam -->
    <path d="M 340 95 C 340 70, 460 70, 460 95 L 452 165 C 452 178, 348 178, 348 165 Z" fill="url(#body-prem)"/>
    
    <!-- Curved Panoramic Visor -->
    <rect x="350" y="105" width="100" height="40" rx="12" fill="#020617"/>
    <circle cx="375" cy="125" r="8" fill="#38BDF8"/>
    <circle cx="425" cy="125" r="8" fill="#38BDF8"/>
    <rect x="393" y="123" width="14" height="4" rx="2" fill="#38BDF8"/>

    <!-- High-res Telepresence PTZ Camera Dome -->
    <circle cx="400" cy="85" r="9" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="400" cy="85" r="4" fill="#38BDF8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · ASSISTANT PREMIUM</text>
</svg>
