<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere-titan" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="sensor-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad8)"/>
  <ellipse cx="400" cy="495" rx="190" ry="26" fill="url(#plat-glow8)"/>

  <g filter="url(#shadow8)">
    <!-- Industrial Titanium/Carbon Armored Outer Shell -->
    <circle cx="400" cy="300" r="160" fill="url(#sphere-titan)"/>
    
    <!-- Armored Armor Plates Segment Seams -->
    <path d="M 240 300 A 160 160 0 0 1 560 300" fill="none" stroke="#0F172A" stroke-width="4"/>
    <ellipse cx="400" cy="300" rx="160" ry="60" fill="none" stroke="#0F172A" stroke-width="4"/>
    <line x1="400" y1="140" x2="400" y2="460" stroke="#0F172A" stroke-width="4"/>

    <!-- Central 360 Panoramic Multi-Spectral Optical Pod -->
    <circle cx="400" cy="300" r="54" fill="#020617" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="400" cy="300" r="40" fill="url(#sensor-gold)"/>
    <circle cx="400" cy="300" r="22" fill="#020617"/>
    <circle cx="392" cy="292" r="7" fill="#FFFFFF" opacity="0.8"/>

    <!-- Thermal / LiDAR Sensor Array Nodes -->
    <circle cx="300" cy="230" r="14" fill="#020617" stroke="#64748B" stroke-width="2"/>
    <circle cx="300" cy="230" r="6" fill="#F43F5E"/>
    
    <circle cx="500" cy="230" r="14" fill="#020617" stroke="#64748B" stroke-width="2"/>
    <circle cx="500" cy="230" r="6" fill="#F43F5E"/>

    <circle cx="300" cy="370" r="14" fill="#020617" stroke="#64748B" stroke-width="2"/>
    <circle cx="300" cy="370" r="6" fill="#10B981"/>

    <circle cx="500" cy="370" r="14" fill="#020617" stroke="#64748B" stroke-width="2"/>
    <circle cx="500" cy="370" r="6" fill="#10B981"/>

    <!-- Perimeter LED Ring -->
    <ellipse cx="400" cy="300" rx="158" ry="58" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="16 8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · SPHERE AI</text>
</svg>
