<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podium-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="disp-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad4)"/>
  <ellipse cx="400" cy="505" rx="200" ry="28" fill="url(#plat-glow4)"/>

  <g filter="url(#shadow4)">
    <!-- Heavy Cast Aluminum Base -->
    <ellipse cx="400" cy="480" rx="140" ry="26" fill="#0F172A"/>
    <ellipse cx="400" cy="475" rx="136" ry="22" fill="url(#podium-metal)"/>
    <ellipse cx="400" cy="470" rx="110" ry="16" fill="#334155"/>

    <!-- Support Pedestal Pillar -->
    <path d="M 368 280 L 432 280 L 420 468 L 380 468 Z" fill="url(#podium-metal)"/>
    <line x1="400" y1="290" x2="400" y2="455" stroke="#94A3B8" stroke-width="2"/>

    <!-- Articulated Tilt Neck / Joint -->
    <circle cx="400" cy="275" r="22" fill="#1E293B"/>
    <circle cx="400" cy="275" r="8" fill="#38BDF8"/>

    <!-- Tablet / Display Console Frame (Angled ergonomic view) -->
    <rect x="250" y="115" width="300" height="195" rx="20" fill="url(#podium-metal)"/>
    <rect x="260" y="125" width="280" height="175" rx="14" fill="#0F172A"/>
    
    <!-- Active Display Screen -->
    <rect x="268" y="133" width="264" height="159" rx="10" fill="url(#disp-screen)"/>
    
    <!-- UI Dashboard on screen -->
    <rect x="285" y="150" width="100" height="24" rx="6" fill="#38BDF8" opacity="0.9"/>
    <circle cx="297" cy="162" r="6" fill="#FFFFFF"/>
    <rect x="310" y="159" width="60" height="6" rx="3" fill="#FFFFFF"/>
    
    <rect x="285" y="185" width="230" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="300" y="215" font-family="'Inter', sans-serif" font-size="14" fill="#F8FAFC" font-weight="500">Welcome to Reception</text>
    <text x="495" y="215" font-family="'Inter', sans-serif" font-size="12" fill="#38BDF8">TAP</text>
    
    <rect x="285" y="245" width="105" height="30" rx="6" fill="#0284C7"/>
    <rect x="410" y="245" width="105" height="30" rx="6" fill="#334155"/>

    <!-- Top Camera & Microphone Array Bar -->
    <rect x="340" y="100" width="120" height="18" rx="7" fill="#0F172A"/>
    <circle cx="400" cy="109" r="4.5" fill="#38BDF8"/>
    <circle cx="370" cy="109" r="2" fill="#64748B"/>
    <circle cx="430" cy="109" r="2" fill="#64748B"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · ASSISTANT ESSENTIAL</text>
</svg>
