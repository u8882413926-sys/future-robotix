<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body-white5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="trim-dark5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad5)"/>
  <ellipse cx="400" cy="520" rx="220" ry="32" fill="url(#plat-glow5)"/>

  <g filter="url(#shadow5)">
    <!-- Wheeled Autonomous Mobile Base -->
    <rect x="290" y="440" width="220" height="60" rx="20" fill="url(#trim-dark5)"/>
    <!-- Caster / Wheels -->
    <ellipse cx="320" cy="500" rx="24" ry="10" fill="#020617"/>
    <ellipse cx="480" cy="500" rx="24" ry="10" fill="#020617"/>
    <!-- Base bumper sensor & LED ring -->
    <path d="M 300 475 L 500 475" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

    <!-- Cylindrical Lower Chassis -->
    <path d="M 320 280 L 480 280 L 495 445 L 305 445 Z" fill="url(#body-white5)"/>
    
    <!-- Delivery Tray / Document Storage Shelf -->
    <rect x="330" y="335" width="140" height="42" rx="10" fill="url(#trim-dark5)"/>
    <rect x="340" y="342" width="120" height="28" rx="6" fill="#F8FAFC"/>
    <text x="400" y="360" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748B" font-weight="600">DELIVERY TRAY</text>

    <!-- Upper Body Column -->
    <rect x="355" y="190" width="90" height="95" rx="16" fill="url(#body-white5)"/>

    <!-- Angled 10-inch Interactive Screen -->
    <rect x="325" y="195" width="150" height="100" rx="14" fill="url(#trim-dark5)" transform="rotate(-6 400 245)"/>
    <rect x="332" y="202" width="136" height="86" rx="10" fill="#0F172A" transform="rotate(-6 400 245)"/>
    <circle cx="365" cy="235" r="14" fill="#38BDF8"/>
    <rect x="390" y="225" width="60" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="390" y="238" width="40" height="5" rx="2.5" fill="#94A3B8"/>

    <!-- Head Unit with Display Visor & 3D Sensor -->
    <path d="M 345 110 C 345 85, 455 85, 455 110 L 448 185 C 448 195, 352 195, 352 185 Z" fill="url(#body-white5)"/>
    <rect x="358" y="120" width="84" height="42" rx="12" fill="#020617"/>
    <!-- Animated friendly eyes -->
    <ellipse cx="382" cy="140" rx="8" ry="7" fill="#38BDF8"/>
    <ellipse cx="418" cy="140" rx="8" ry="7" fill="#38BDF8"/>
    <!-- Mic bar on top -->
    <circle cx="400" cy="98" r="4" fill="#38BDF8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · ASSISTANT INTERACTIVE</text>
</svg>
