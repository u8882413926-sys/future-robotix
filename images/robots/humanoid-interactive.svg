<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9FAFB"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
    <radialGradient id="plat-glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arm-w2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F2F4F7"/>
      <stop offset="100%" stop-color="#D4D9E2"/>
    </linearGradient>
    <linearGradient id="arm-d2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282C34"/>
      <stop offset="100%" stop-color="#14171C"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad2)"/>
  <ellipse cx="400" cy="520" rx="230" ry="34" fill="url(#plat-glow2)"/>

  <g filter="url(#shadow2)">
    <!-- Legs & Feet -->
    <rect x="336" y="380" width="40" height="100" rx="12" fill="url(#arm-w2)"/>
    <rect x="424" y="380" width="40" height="100" rx="12" fill="url(#arm-w2)"/>
    <circle cx="356" cy="430" r="12" fill="url(#arm-d2)"/>
    <circle cx="444" cy="430" r="12" fill="url(#arm-d2)"/>
    <!-- Feet -->
    <path d="M 324 478 L 382 478 L 396 515 L 314 515 Z" fill="url(#arm-d2)"/>
    <path d="M 418 478 L 476 478 L 486 515 L 404 515 Z" fill="url(#arm-d2)"/>

    <!-- Pelvis -->
    <rect x="345" y="348" width="110" height="42" rx="14" fill="url(#arm-d2)"/>

    <!-- Torso -->
    <path d="M 320 195 L 480 195 L 456 355 L 344 355 Z" fill="url(#arm-w2)"/>

    <!-- Chest Interactive Touch Display -->
    <rect x="350" y="225" width="100" height="85" rx="10" fill="#0A0E17"/>
    <rect x="355" y="230" width="90" height="75" rx="7" fill="url(#screen-glow)"/>
    <!-- UI graphics on chest screen -->
    <circle cx="400" cy="255" r="12" fill="#FFFFFF" opacity="0.9"/>
    <rect x="370" y="278" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/>
    <rect x="380" y="288" width="40" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>

    <!-- Shoulders & Arms in gesture -->
    <circle cx="298" cy="210" r="24" fill="url(#arm-d2)"/>
    <circle cx="502" cy="210" r="24" fill="url(#arm-d2)"/>

    <!-- Left Arm -->
    <rect x="274" y="222" width="30" height="80" rx="9" fill="url(#arm-w2)" transform="rotate(10 289 262)"/>
    <circle cx="280" cy="310" r="14" fill="url(#arm-d2)"/>
    <rect x="270" y="320" width="26" height="70" rx="7" fill="url(#arm-w2)" transform="rotate(-15 283 355)"/>
    <rect x="276" y="390" width="22" height="24" rx="6" fill="url(#arm-d2)"/>

    <!-- Right Arm (Welcome gesture) -->
    <rect x="496" y="222" width="30" height="80" rx="9" fill="url(#arm-w2)" transform="rotate(-15 511 262)"/>
    <circle cx="522" cy="305" r="14" fill="url(#arm-d2)"/>
    <rect x="522" y="305" width="26" height="70" rx="7" fill="url(#arm-w2)" transform="rotate(-40 535 340)"/>
    <rect x="560" y="340" width="22" height="24" rx="6" fill="url(#arm-d2)"/>

    <!-- Neck -->
    <rect x="382" y="165" width="36" height="34" rx="6" fill="url(#arm-d2)"/>

    <!-- Head Unit with Friendly Visor -->
    <path d="M 346 100 C 346 80, 454 80, 454 100 L 448 170 C 448 180, 352 180, 352 170 Z" fill="url(#arm-w2)"/>
    <rect x="358" y="112" width="84" height="34" rx="10" fill="#0C1017"/>
    <!-- Expressive Eyes -->
    <ellipse cx="384" cy="128" rx="8" ry="6" fill="#00E5FF"/>
    <ellipse cx="416" cy="128" rx="8" ry="6" fill="#00E5FF"/>
    <!-- Mic Array -->
    <circle cx="370" cy="95" r="2.5" fill="#607D8B"/>
    <circle cx="400" cy="92" r="3" fill="#00E5FF"/>
    <circle cx="430" cy="95" r="2.5" fill="#607D8B"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#90A4AE" letter-spacing="3">FUTURE ROBOTIX · HUMANOID INTERACTIVE</text>
</svg>
