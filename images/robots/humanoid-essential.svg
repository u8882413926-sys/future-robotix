<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
    <radialGradient id="platform-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0F2F5"/>
      <stop offset="100%" stop-color="#D9DEE4"/>
    </linearGradient>
    <linearGradient id="armor-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3139"/>
      <stop offset="100%" stop-color="#181A1F"/>
    </linearGradient>
    <linearGradient id="visor-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0091EA"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <ellipse cx="400" cy="515" rx="220" ry="32" fill="url(#platform-glow)"/>
  
  <!-- Robot Group -->
  <g filter="url(#soft-shadow)">
    <!-- Legs & Feet -->
    <rect x="340" y="380" width="36" height="95" rx="10" fill="url(#armor-white)"/>
    <rect x="424" y="380" width="36" height="95" rx="10" fill="url(#armor-white)"/>
    <rect x="348" y="420" width="20" height="40" rx="4" fill="url(#armor-dark)"/>
    <rect x="432" y="420" width="20" height="40" rx="4" fill="url(#armor-dark)"/>
    <!-- Feet -->
    <path d="M 330 475 L 382 475 L 392 510 L 320 510 Z" fill="url(#armor-dark)"/>
    <path d="M 418 475 L 470 475 L 480 510 L 408 510 Z" fill="url(#armor-dark)"/>
    
    <!-- Pelvis / Hip Joints -->
    <rect x="350" y="350" width="100" height="40" rx="12" fill="url(#armor-dark)"/>
    <circle cx="358" cy="370" r="14" fill="#607D8B"/>
    <circle cx="442" cy="370" r="14" fill="#607D8B"/>

    <!-- Torso -->
    <path d="M 330 200 L 470 200 L 450 355 L 350 355 Z" fill="url(#armor-white)"/>
    <path d="M 360 220 L 440 220 L 430 330 L 370 330 Z" fill="url(#armor-dark)"/>
    <!-- Status Indicator LED -->
    <circle cx="400" cy="245" r="7" fill="url(#visor-glow)"/>
    <line x1="375" y1="280" x2="425" y2="280" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="382" y1="292" x2="418" y2="292" stroke="#455A64" stroke-width="2" stroke-linecap="round"/>

    <!-- Shoulders & Arms -->
    <circle cx="308" cy="215" r="22" fill="url(#armor-dark)"/>
    <circle cx="492" cy="215" r="22" fill="url(#armor-dark)"/>
    <!-- Upper arms -->
    <rect x="294" y="230" width="28" height="75" rx="8" fill="url(#armor-white)"/>
    <rect x="478" y="230" width="28" height="75" rx="8" fill="url(#armor-white)"/>
    <!-- Elbows -->
    <circle cx="308" cy="315" r="12" fill="url(#armor-dark)"/>
    <circle cx="492" cy="315" r="12" fill="url(#armor-dark)"/>
    <!-- Forearms -->
    <rect x="296" y="325" width="24" height="65" rx="6" fill="url(#armor-white)"/>
    <rect x="480" y="325" width="24" height="65" rx="6" fill="url(#armor-white)"/>
    <!-- Hands / End Effectors -->
    <rect x="298" y="390" width="20" height="22" rx="6" fill="url(#armor-dark)"/>
    <rect x="482" y="390" width="20" height="22" rx="6" fill="url(#armor-dark)"/>

    <!-- Neck -->
    <rect x="385" y="170" width="30" height="34" rx="6" fill="url(#armor-dark)"/>

    <!-- Head Unit -->
    <path d="M 352 110 C 352 90, 448 90, 448 110 L 442 175 C 442 185, 358 185, 358 175 Z" fill="url(#armor-white)"/>
    <!-- Visor -->
    <rect x="362" y="122" width="76" height="24" rx="8" fill="#101418"/>
    <rect x="370" y="128" width="60" height="12" rx="5" fill="url(#visor-glow)"/>
    <!-- Top Sensors -->
    <circle cx="400" cy="100" r="4" fill="#00E5FF"/>
  </g>
  
  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#90A4AE" letter-spacing="3">FUTURE ROBOTIX · HUMANOID ESSENTIAL</text>
</svg>
