<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere-light" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="85%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad7)"/>
  <ellipse cx="400" cy="490" rx="190" ry="26" fill="url(#plat-glow7)"/>

  <g filter="url(#shadow7)">
    <!-- Base Outer Polycarbonate Spherical Shell -->
    <circle cx="400" cy="300" r="160" fill="url(#sphere-light)"/>
    
    <!-- Translucent Shell Highlights -->
    <ellipse cx="340" cy="210" rx="90" ry="45" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 340 210)"/>

    <!-- Luminous Gyroscopic Equatorial Ring -->
    <ellipse cx="400" cy="300" rx="160" ry="52" fill="none" stroke="url(#ring-glow)" stroke-width="12" transform="rotate(-18 400 300)"/>
    <ellipse cx="400" cy="300" rx="156" ry="48" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8" transform="rotate(-18 400 300)"/>

    <!-- Internal Gyro Core & Drive Motor Silhouette -->
    <circle cx="400" cy="300" r="64" fill="#0F172A" opacity="0.85"/>
    <circle cx="400" cy="300" r="48" fill="#1E293B"/>
    <circle cx="400" cy="300" r="28" fill="#38BDF8"/>
    <circle cx="400" cy="300" r="14" fill="#FFFFFF"/>

    <!-- LED Status Matrix Nodes -->
    <circle cx="300" cy="275" r="5" fill="#00E5FF"/>
    <circle cx="500" cy="325" r="5" fill="#00E5FF"/>
    <circle cx="360" cy="380" r="4" fill="#8B5CF6"/>
    <circle cx="440" cy="220" r="4" fill="#3B82F6"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · SPHERE PLAY</text>
</svg>
