<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="plat-glow12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing-lum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="body-core12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad12)"/>
  <ellipse cx="400" cy="510" rx="220" ry="28" fill="url(#plat-glow12)"/>

  <!-- Subtle suspension / tether guide lines -->
  <line x1="400" y1="40" x2="400" y2="180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g filter="url(#shadow12)">
    <!-- Left Forewing -->
    <path d="M 390 240 C 330 140, 160 120, 120 200 C 90 260, 200 360, 380 290 Z" fill="url(#wing-lum)" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 385 245 C 330 170, 200 160, 150 220" stroke="#FFFFFF" stroke-width="2" opacity="0.7" fill="none"/>
    <path d="M 385 260 C 310 220, 230 260, 180 300" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" fill="none"/>

    <!-- Right Forewing -->
    <path d="M 410 240 C 470 140, 640 120, 680 200 C 710 260, 600 360, 420 290 Z" fill="url(#wing-lum)" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 415 245 C 470 170, 600 160, 650 220" stroke="#FFFFFF" stroke-width="2" opacity="0.7" fill="none"/>
    <path d="M 415 260 C 490 220, 570 260, 620 300" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" fill="none"/>

    <!-- Left Hindwing -->
    <path d="M 385 285 C 320 310, 220 360, 240 440 C 260 500, 350 450, 390 340 Z" fill="url(#wing-lum)" stroke="#818CF8" stroke-width="2"/>
    
    <!-- Right Hindwing -->
    <path d="M 415 285 C 480 310, 580 360, 560 440 C 540 500, 450 450, 410 340 Z" fill="url(#wing-lum)" stroke="#818CF8" stroke-width="2"/>

    <!-- Central Kinetic Fuselage / Body Core -->
    <rect x="382" y="190" width="36" height="150" rx="18" fill="url(#body-core12)"/>
    <rect x="386" y="210" width="28" height="110" rx="14" fill="#1E293B"/>

    <!-- Micro-actuator Joint Nodes -->
    <circle cx="400" cy="235" r="8" fill="#38BDF8"/>
    <circle cx="400" cy="285" r="8" fill="#818CF8"/>
    
    <!-- Optical Guidance Projector Lens at Base -->
    <circle cx="400" cy="335" r="7" fill="#00E5FF"/>
    
    <!-- Antennae / Spatial Sonar Sensors -->
    <path d="M 390 195 Q 360 140 330 130" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="330" cy="130" r="5" fill="#38BDF8"/>

    <path d="M 410 195 Q 440 140 470 130" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="470" cy="130" r="5" fill="#38BDF8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · BUTTERFLY GUIDE</text>
</svg>
