<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F6F8"/>
      <stop offset="100%" stop-color="#E5E8EB"/>
    </linearGradient>
    <radialGradient id="plat-glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor-titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="carbon-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad3)"/>
  <ellipse cx="400" cy="525" rx="240" ry="36" fill="url(#plat-glow3)"/>

  <g filter="url(#shadow3)">
    <!-- High-torque bipedal legs -->
    <rect x="330" y="370" width="46" height="110" rx="14" fill="url(#armor-titanium)"/>
    <rect x="424" y="370" width="46" height="110" rx="14" fill="url(#armor-titanium)"/>
    <!-- Articulated knee joints with carbon trim -->
    <circle cx="353" cy="425" r="15" fill="url(#carbon-black)"/>
    <circle cx="447" cy="425" r="15" fill="url(#carbon-black)"/>
    <circle cx="353" cy="425" r="6" fill="#38BDF8"/>
    <circle cx="447" cy="425" r="6" fill="#38BDF8"/>
    <!-- Precision feet -->
    <path d="M 315 475 L 380 475 L 398 518 L 306 518 Z" fill="url(#carbon-black)"/>
    <path d="M 420 475 L 485 475 L 494 518 L 402 518 Z" fill="url(#carbon-black)"/>

    <!-- Pelvis / Kinematic Core -->
    <rect x="335" y="340" width="130" height="46" rx="16" fill="url(#carbon-black)"/>

    <!-- Multi-segment Chest & Spine -->
    <path d="M 310 180 L 490 180 L 460 348 L 340 348 Z" fill="url(#armor-titanium)"/>
    <path d="M 338 200 L 462 200 L 442 330 L 358 330 Z" fill="url(#carbon-black)"/>
    
    <!-- Central Core Reactor / Battery Matrix -->
    <circle cx="400" cy="245" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="400" cy="245" r="9" fill="url(#gold-amber)"/>
    <line x1="365" y1="285" x2="435" y2="285" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <line x1="375" y1="298" x2="425" y2="298" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

    <!-- High-DOF Shoulders & Arms -->
    <circle cx="286" cy="195" r="26" fill="url(#carbon-black)"/>
    <circle cx="514" cy="195" r="26" fill="url(#carbon-black)"/>
    <rect x="268" y="215" width="36" height="85" rx="10" fill="url(#armor-titanium)"/>
    <rect x="496" y="215" width="36" height="85" rx="10" fill="url(#armor-titanium)"/>
    <!-- Elbows -->
    <circle cx="286" cy="310" r="15" fill="url(#carbon-black)"/>
    <circle cx="514" cy="310" r="15" fill="url(#carbon-black)"/>
    <!-- Forearms -->
    <rect x="272" y="322" width="28" height="75" rx="8" fill="url(#armor-titanium)"/>
    <rect x="500" y="322" width="28" height="75" rx="8" fill="url(#armor-titanium)"/>
    <!-- 5-Finger Articulated Robotic Hands -->
    <path d="M 272 397 C 272 397, 260 415, 266 430 C 272 440, 296 440, 296 425 Z" fill="url(#carbon-black)"/>
    <path d="M 528 397 C 528 397, 540 415, 534 430 C 528 440, 504 440, 504 425 Z" fill="url(#carbon-black)"/>

    <!-- High-Rigidity Neck -->
    <rect x="378" y="145" width="44" height="38" rx="8" fill="url(#carbon-black)"/>

    <!-- Head & 3D LiDAR Module -->
    <!-- 360 LiDAR Puck on top -->
    <rect x="382" y="70" width="36" height="18" rx="5" fill="#0F172A"/>
    <line x1="385" y1="79" x2="415" y2="79" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Head Chasis -->
    <path d="M 342 88 C 342 75, 458 75, 458 88 L 452 152 C 452 165, 348 165, 348 152 Z" fill="url(#armor-titanium)"/>
    <!-- Quad-sensor Optical Visor -->
    <rect x="354" y="102" width="92" height="30" rx="8" fill="#020617"/>
    <circle cx="374" cy="117" r="7" fill="#38BDF8"/>
    <circle cx="400" cy="117" r="5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="426" cy="117" r="7" fill="#38BDF8"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">FUTURE ROBOTIX · HUMANOID ULTIMATE</text>
</svg>
